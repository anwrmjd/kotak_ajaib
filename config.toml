# .streamlit/config.toml
# Konfigurasi tema Streamlit Cloud.
# Letakkan file ini di folder .streamlit/ di root repository.

[theme]
base            = "light"
primaryColor    = "#FF6600"       # Oranye — sesuai branding Orange Data Mining
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF5EE"
textColor       = "#1A1A2E"
font            = "sans serif"

[server]
# Streamlit Cloud mengelola port secara otomatis; tidak perlu mengubah ini.
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
